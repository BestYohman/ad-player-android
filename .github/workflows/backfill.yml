# One-off: makes a release for each earlier version, with what changed and the app as it was then.
name: Releases for earlier versions
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in 1.0.0:40939137289 1.1.0:40948615189 1.2.0:40988360957 1.3.0:41071962638 1.4.0:41458994451 1.5.0:41533263161 1.6.0:41719327434 1.7.0:41833409706; do
            v=${pair%%:*}; run=${pair##*:}
            sha=$(gh api repos/${{ github.repository }}/actions/runs/$run -q .head_sha)
            rm -rf "d$v"; mkdir "d$v"
            gh run download "$run" -n ADPlayer -D "d$v" || true
            awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {if(on) exit} on' CHANGELOG.md > "d$v/notes.md"
            printf '\nAn older version. The newest is under "AD Player (latest)".\n' >> "d$v/notes.md"
            gh release delete "v$v" --yes --cleanup-tag 2>/dev/null || true
            if [ -f "d$v/ADPlayer.apk" ]; then
              gh release create "v$v" "d$v/ADPlayer.apk" --title "AD Player $v" --notes-file "d$v/notes.md" --target "$sha" --latest=false
            else
              gh release create "v$v" --title "AD Player $v" --notes-file "d$v/notes.md" --target "$sha" --latest=false
            fi
          done
