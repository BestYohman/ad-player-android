# Takes screenshots of the app on an Android emulator, against a stand-in PC with test data (.github/screens).
# Started by hand ("Run workflow"); the pictures go to the "screens" branch.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --console=plain
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screens/run.sh
      - name: Keep the screenshots in the screens branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp -r shots/. "$RUNNER_TEMP/s/" 2>/dev/null; cd "$RUNNER_TEMP/s"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots ${{ github.run_number }}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/screens
