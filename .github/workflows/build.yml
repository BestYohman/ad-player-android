# Builds the Android app on GitHub every time a file changes (or when "Run workflow" is pressed).
# The finished app (ADPlayer.apk) appears under Releases as "AD Player (latest)".
name: Build the Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: List the errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |error:|What went wrong|> " build.log | sed -e "s#$PWD/##" | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:" build.log | sed -e "s#$PWD/##" | head -80 > errors.txt || true

      - name: Keep the build log in the ci-log branch
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/cilog" && cd "$RUNNER_TEMP/cilog"
          git init -q
          tail -c 900000 "$GITHUB_WORKSPACE/build.log" > build.log || true
          cp "$GITHUB_WORKSPACE/errors.txt" . 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }} failed"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-log

      - name: Name the app
        run: cp app/build/outputs/apk/release/app-release.apk ADPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ADPlayer
          path: ADPlayer.apk

      - name: Publish as "AD Player (latest)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ADPlayer.apk --title "AD Player (latest)" \
            --notes "Build ${{ github.run_number }}. On the phone: tap ADPlayer.apk to download it, then open it to install."
